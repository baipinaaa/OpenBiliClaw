name: Release Desktop Installers

# Tag-triggered auto-publish. Push a `desktop-v*` tag (e.g. `desktop-v0.3.102`)
# and this builds the macOS (.dmg) + Windows (.exe) installers and publishes them
# to a GitHub *pre-release* (the app is pre-alpha). This is the
# auto-publish counterpart to build-installers.yml (manual, artifacts-only).
#
# Scope note: the backend SOURCE stays source-only (`backend-v*` tags are git
# markers, no Release) — only the desktop installer BINARIES ship here.
#
# Arch note: automatic releases build the Windows x64 installer. The macOS arm64
# .dmg is opt-in: run this workflow manually with `build_macos` ticked (it needs
# the Apple signing/notarization secrets to be configured). Tag pushes skip it.
# Signed/notarized Intel x64 builds use the manual build-installers.yml workflow.
on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build the macOS .dmg (requires Apple signing secrets)."
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

# Needs write access to publish the Release (build-installers.yml stays read-only).
permissions:
  contents: write

jobs:
  macos:
    name: macOS installer (.dmg, arm64)
    # Tag pushes build Windows only; tick `build_macos` when dispatching by hand.
    if: ${{ inputs.build_macos == true }}
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Developer ID signing and notarization
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          notary-user: ${{ secrets.APPLE_NOTARY_USER }}
          notary-password: ${{ secrets.APPLE_NOTARY_PASSWORD }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: cmd/openbiliclaw-tailnet/go.sum

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # [packaging] pulls pyinstaller + pystray + Pillow + pyobjc (menu-bar tray).
          pip install -e ".[packaging]" "pytest>=8"

      - name: Run macOS installer handoff E2E
        run: python -m pytest -q tests/test_macos_installer_e2e.py

      - name: Prefetch embedded Tailnet modules for every target
        run: python scripts/generate_tailnet_notices.py --prefetch

      - name: Resolve version
        id: ver
        run: |
          # desktop-v0.3.102 -> v0.3.102 (a tagged release IS the version; no SHA stamp).
          v="${GITHUB_REF_NAME#desktop-}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build .app + .dmg
        run: python packaging/build.py --clean --archive-version "${{ steps.ver.outputs.version }}-arm64"

      - name: Verify frozen macOS startup after signing
        shell: python
        run: |
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          app = Path("dist/OpenBiliClaw.app").resolve()
          with tempfile.TemporaryDirectory(prefix="obc-frozen-smoke-") as profile:
              env = dict(os.environ, OPENBILICLAW_SELFTEST="1", OPENBILICLAW_PROJECT_ROOT=profile)
              result = subprocess.run([str(app / "Contents/MacOS/OpenBiliClaw")], env=env, timeout=180)
              log = Path(profile) / "logs/desktop.log"
              text = log.read_text(encoding="utf-8") if log.exists() else ""
              if result.returncode or "selftest OK" not in text:
                  raise RuntimeError(f"Frozen startup failed ({result.returncode}): {text[-8000:]}")
          subprocess.run([str(app / "Contents/Resources/openbiliclaw-tailnet-helper"), "--self-test"], check=True, timeout=30)

      - name: Enforce GitHub asset size limit (< 2GB)
        run: |
          for f in dist/release/*.dmg dist/release/*.zip; do
            [ -e "$f" ] || continue
            sz=$(stat -f%z "$f")
            printf '%s = %s MiB\n' "$f" "$((sz / 1024 / 1024))"
            [ "$sz" -le 2147483648 ] || { echo "ERROR: $f exceeds GitHub's 2GB asset limit"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: openbiliclaw-macos-installer-arm64
          path: |
            dist/release/*.dmg
            dist/release/*.zip
          if-no-files-found: error

      - name: Preserve Apple notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-notary-logs
          path: dist/notary-logs/
          if-no-files-found: ignore

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN"
          fi

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: cmd/openbiliclaw-tailnet/go.sum

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          # [packaging] pulls pyinstaller + pystray + Pillow (tray desktop mode).
          pip install -e ".[packaging]" "pytest>=8"

      - name: Run real Windows HKCU autostart E2E
        run: python -m pytest -q tests/test_windows_autostart_e2e.py

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#desktop-}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "bare=${v#v}" >> "$GITHUB_OUTPUT"
          numeric="$(python -c 'import re,sys; m=re.match(r"v?(\d+)\.(\d+)\.(\d+)", sys.argv[1]); print(f"{m.group(1)}.{m.group(2)}.{m.group(3)}.0" if m else "0.0.0.0")' "$v")"
          echo "version_info=$numeric" >> "$GITHUB_OUTPUT"

      - name: Prefetch embedded Tailnet modules for every target
        run: python scripts/generate_tailnet_notices.py --prefetch

      - name: PyInstaller onedir build
        run: python packaging/build.py --clean --archive-version "${{ steps.ver.outputs.version }}"

      - name: Run real frozen-bundle autostart lifecycle E2E
        shell: pwsh
        run: |
          $env:OPENBILICLAW_FROZEN_EXE = (Resolve-Path "dist\OpenBiliClaw\OpenBiliClaw.exe").Path
          python -m pytest -q tests/test_windows_autostart_e2e.py -k real_frozen_bundle

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.bare }} /DMyAppVersionInfoVersion=${{ steps.ver.outputs.version_info }} packaging\openbiliclaw.iss

      - name: Install and test the actual Windows installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "dist\release\*.exe" | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP "OpenBiliClaw-installed"
          $env:OPENBILICLAW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "OpenBiliClaw-installer-bootstrap"
          $env:OPENBILICLAW_SELFTEST = "1"
          if (Test-Path $env:OPENBILICLAW_PROJECT_ROOT) { Remove-Item -Recurse -Force $env:OPENBILICLAW_PROJECT_ROOT }
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          # The silent install must hand off to the freshly written exe. The
          # selftest instance exits as soon as the backend is assembled, so a
          # plain Get-Process races with that exit; assert on the profile it
          # creates instead (a Get-Process | Wait-Process with no process is a
          # silent no-op), then wait out any instance still running.
          $marker = Join-Path $env:OPENBILICLAW_PROJECT_ROOT "config.toml"
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $marker) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $marker)) {
            throw "Silent install did not launch OpenBiliClaw (never wrote $marker)"
          }
          Get-Process -Name OpenBiliClaw -ErrorAction SilentlyContinue |
            Wait-Process -Timeout 180 -ErrorAction Stop
          $env:OPENBILICLAW_FROZEN_EXE = (Resolve-Path "$installDir\OpenBiliClaw.exe").Path
          python -m pytest -q tests/test_windows_autostart_e2e.py -k real_frozen_bundle

      - name: Enforce GitHub asset size limit (< 2GB)
        shell: pwsh
        run: |
          Get-ChildItem dist\release\*.exe | ForEach-Object {
            $mib = [math]::Round($_.Length / 1MB)
            Write-Host "$($_.Name) = $mib MiB"
            if ($_.Length -gt 2147483648) { throw "$($_.Name) exceeds GitHub's 2GB asset limit" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: openbiliclaw-windows-installer
          path: dist/release/*.exe
          if-no-files-found: error

  publish:
    name: Publish desktop pre-release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    # always() so a single failed build leg still ships the other installer
    # rather than blocking the whole release.
    if: ${{ always() }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download built installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: openbiliclaw-*
          merge-multiple: true

      - name: List downloaded installers
        run: ls -lhR release-artifacts || true

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'EOF'
          **桌面预发布安装包**。默认只发布 Windows 安装包；macOS 安装包在手动触发并勾选 `build_macos` 时构建，均经过 Developer ID 签名和 Apple 公证；缺少凭据或公证失败时停止对应构建，不生成实验包。后端源码仍为 source-only，此处只发桌面应用二进制。

          ### 安装
          - **macOS**：退出旧版，打开 DMG，将 OpenBiliClaw 拖到 Applications 后启动。无需解除隔离；首次打开可能显示正常的互联网下载确认。
          - **Windows**：在「选择目标位置」页选安装目录。升级默认沿用原目录；换盘请先卸载旧版，再选择新目录。SmartScreen 弹窗点「更多信息 → 仍要运行」。

          纯远程推理（聊天与 embedding 均走你配置的云端 API，无内置本地模型），常驻 macOS 菜单栏 / Windows 系统托盘。数据在 `~/OpenBiliClaw`（macOS / Linux）/ `%USERPROFILE%\OpenBiliClaw`（Windows），升级 / 卸载不动它。Intel mac（x64）.dmg 未自动构建，需要时用手动的 build-installers.yml 产出后补挂。
          EOF

          ensure_release() {
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes-file "$notes_file"
              return
            fi

            for attempt in 1 2 3; do
              if gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --notes-file "$notes_file"; then
                return
              fi
              if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes-file "$notes_file"
                return
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }

          ensure_release
          shopt -s nullglob
          assets=(release-artifacts/*.dmg release-artifacts/*.exe)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installer assets found"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done

      - name: Update aggregate latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHANNEL: desktop
          ASSET_GLOBS: release-artifacts/*.dmg release-artifacts/*.exe
        run: bash .github/scripts/sync-aggregate-release.sh
